approvals_reviewer = "user"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
service_tier = "default"
approval_policy = "on-request"
default_permissions = "claude-auto"
web_search = "live"

[permissions.claude-auto]
description = "Workspace access with writable Codex settings and rules."
extends = ":workspace"

[permissions.claude-auto.filesystem.":workspace_roots"]
".codex" = "write"
".codex/AGENTS.md" = "read"
".codex/agents" = "read"
".codex/config.toml" = "write"
".codex/rules" = "write"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[features]
fast_mode = false
js_repl = false
memories = true
multi_agent = true

[mcp_servers.gitlab-cli]
command = "glab"
args = ["mcp", "serve"]
default_tools_approval_mode = "approve"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY = "1"

[tui]
alternate_screen = "always"
status_line = [
    "model-with-reasoning",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
    "git-branch",
]
terminal_title = ["spinner", "project", "git-branch"]

[tui.keymap.global]
open_transcript = "ctrl-t"
open_external_editor = "ctrl-g"

[tui.keymap.chat]
interrupt_turn = "ctrl-x"

[memories]
generate_memories = true
use_memories = true
